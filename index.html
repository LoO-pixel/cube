<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neugierwürfel">
<title>Neugierwürfel</title>
<meta name="theme-color" content="#0d0f21">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: Vollbild-Bühne mit schwebendem Würfel im Lichtkegel; oben Münz-HUD mit Schichtleiste und Kristall-Chip, unten Dock; Werkstatt und Kristallschmiede als Bottom-Sheets */
:root{
  --ink:#0d0f21;
  --stage:#1a1d3a;
  --spot:#2f356a;
  --panel:rgba(21,24,49,.86);
  --panel-solid:#15183a;
  --line:rgba(186,194,255,.15);
  --wash:rgba(255,255,255,.05);
  --fg:#eef0fb;
  --muted:#9ca2c6;
  --gold:#f3c45b;
  --gold-hi:#ffe39a;
  --gold-deep:#b98a26;
  --gold-ink:#2a1d04;
  --cyan:#9fe6ff;
  --warn:#ff9180;
  --layer:#e8e5dc;
  --crystal:#c3a6ff;
  --crystal-hi:#e4d7ff;
  --crystal-deep:#8466dc;
  --crystal-ink:#1d1236;
  --f-display:'Unbounded', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
  --f-body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
body{
  background:radial-gradient(130% 85% at 50% 50%, var(--spot) 0%, var(--stage) 36%, var(--ink) 100%) fixed, var(--ink);
  color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.35;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;touch-action:manipulation}
body{touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

/* HUD */
.hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  background:linear-gradient(180deg, rgba(13,15,33,.72) 0%, rgba(13,15,33,.38) 70%, rgba(13,15,33,0) 100%);padding-bottom:18px}
.hud-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.purse{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.purse-txt{min-width:0;flex:1 1 auto}
.purse .coin{width:30px;height:30px;flex:none;filter:drop-shadow(0 3px 8px rgba(243,196,91,.35))}
.coins{font-family:var(--f-display);font-weight:700;font-size:27px;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.rate{font-size:13px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate b{color:var(--cyan);font-weight:600}
.tools{display:flex;gap:8px;align-items:center;pointer-events:auto;flex:none}
.gem-btn{height:42px;border-radius:13px;border:1px solid rgba(195,166,255,.32);background:var(--panel);display:flex;align-items:center;gap:7px;padding:0 13px 0 10px;cursor:pointer;position:relative;
  font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--crystal-hi);font-variant-numeric:tabular-nums;white-space:nowrap}
.gem-btn svg{width:20px;height:20px}
.gem-btn:active{transform:scale(.96)}
.gem-btn .dot{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:var(--crystal);border:3px solid var(--ink)}
.pill{font-family:var(--f-display);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold);border-radius:999px;padding:6px 10px;white-space:nowrap;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 0 18px rgba(243,196,91,.7)}}
.icon-btn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.icon-btn:active{transform:scale(.95)}
.strata{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.strata-top,.strata-bot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.strata-top b{color:var(--fg);font-weight:600}
.strata-top span:first-child{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.swatch{width:11px;height:11px;border-radius:3px;background:var(--layer);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);flex:none}
.bar{height:6px;border-radius:99px;background:var(--wash);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--layer);border-radius:inherit;transition:width .25s ease}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none;display:grid;grid-template-columns:56px minmax(0,300px) 56px;justify-content:center;align-items:center;gap:14px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.dock > *{pointer-events:auto}
.dock .icon-btn{width:56px;height:56px;border-radius:18px}
.shop-btn{height:56px;width:100%;max-width:300px;justify-self:center;border-radius:18px;border:0;cursor:pointer;position:relative;
  background:linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 55%, var(--gold-deep) 100%);color:var(--gold-ink);
  font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em;
  box-shadow:0 8px 26px rgba(243,196,91,.22), inset 0 1px 0 rgba(255,255,255,.55)}
.shop-btn:active{transform:translateY(1px) scale(.99)}
.shop-btn .dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--cyan);border:3px solid var(--ink)}
.blast{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--panel);position:relative;display:grid;place-items:center;cursor:pointer;padding:0}
.blast svg.ring{position:absolute;inset:-1px;width:56px;height:56px;transform:rotate(-90deg)}
.blast svg.ring circle{fill:none;stroke-width:3}
.blast .track{stroke:var(--wash)}
.blast .prog{stroke:var(--warn);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.blast.ready{color:var(--warn)}
.blast.armed{background:var(--warn);color:var(--ink);box-shadow:0 0 0 6px rgba(255,145,128,.25)}
.blast.locked{color:var(--muted);opacity:.7}
.status{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);z-index:6;pointer-events:none;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.status .pill{padding:8px 13px;font-size:11px}
.combo{
  font-family:var(--f-display);font-size:12px;letter-spacing:.05em;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);padding:7px 13px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.combo b{color:var(--gold);font-weight:700}

/* Sheets */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:68%;display:flex;flex-direction:column;background:var(--panel-solid);
  border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(105%);
  box-shadow:0 -24px 60px rgba(0,0,0,.45);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s linear .32s}
.sheet.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s linear 0s}
.sheet-head{display:flex;align-items:center;gap:10px;padding-block:14px 10px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.sheet-head h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0;flex:1;min-width:0}
.sheet-head .icon-btn{width:38px;height:38px}
.sheet-body{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:grid;gap:8px;align-content:start;
  padding-block:4px calc(env(safe-area-inset-bottom,0px) + 18px);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:7px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--wash);color:var(--fg)}
.up{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 10px 10px 12px;border-radius:15px;background:var(--wash);border:1px solid var(--line)}
.up.locked{opacity:.45}
.up-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--wash);color:var(--gold)}
.up-name{font-weight:600;font-size:15px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.up-name small{color:var(--muted);font-weight:500;font-size:12px;font-variant-numeric:tabular-nums}
.up-eff{font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.buy{min-width:98px;height:44px;border-radius:12px;border:0;cursor:pointer;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.buy svg{width:15px;height:15px}
.buy small{font-weight:600;opacity:.75}
.buy.gem{background:var(--crystal);color:var(--crystal-ink)}
.buy.owned{background:transparent;border:1px solid var(--line);color:var(--muted)}
.gemrow .up-ico{color:var(--crystal)}
.gem-have{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--crystal-hi);font-variant-numeric:tabular-nums;white-space:nowrap}
.gem-have svg{width:20px;height:20px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.skin{display:grid;justify-items:center;gap:5px;padding:12px 2px 10px;border-radius:15px;background:var(--wash);border:1px solid var(--line);cursor:pointer;font-size:12px;letter-spacing:-.01em;font-weight:600;min-width:0}
.skin > svg{width:34px;height:34px}
.skin small{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.skin small svg{width:11px;height:11px}
#sk-ember > svg{filter:drop-shadow(0 0 6px rgba(255,128,48,.75))}
.skin.on{border-color:var(--crystal);box-shadow:inset 0 0 0 1px var(--crystal)}
.skin.on small{color:var(--crystal-hi)}
.skin:disabled{opacity:.45;cursor:default}
.robot{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:15px;border:1px dashed rgba(195,166,255,.4);color:var(--crystal)}
.robot > span{flex:1;min-width:0;color:var(--fg);font-size:14px;line-height:1.35}
.robot small{color:var(--muted);font-size:12.5px}
.switch{width:52px;height:30px;border-radius:99px;border:0;background:var(--wash);position:relative;cursor:pointer;flex:none;padding:0;box-shadow:inset 0 0 0 1px var(--line)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .2s}
.switch[aria-pressed="true"]{background:var(--crystal)}
.switch[aria-pressed="true"]::after{transform:translateX(22px);background:var(--crystal-ink)}
.buy:disabled{background:var(--wash);color:var(--muted);cursor:default}
.buy:not(:disabled):active{transform:scale(.97)}
.stats{display:grid;grid-template-columns:1fr auto;gap:10px 16px;margin:0;font-variant-numeric:tabular-nums}
.stats dt{color:var(--muted)}
.stats dd{margin:0;text-align:right;font-weight:600}
.section-label{font-family:var(--f-display);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.danger{height:46px;border-radius:13px;border:1px solid rgba(255,145,128,.4);background:transparent;color:var(--warn);font-weight:600;cursor:pointer}
.confirm-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.confirm-row button{height:46px;border-radius:13px;font-weight:600;cursor:pointer}
.confirm-row .yes{background:var(--warn);color:var(--ink);border:0}
.confirm-row .no{background:transparent;border:1px solid var(--line)}
.muted-note{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}

/* Toasts, Popups, Modals */
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 148px);z-index:8;pointer-events:none;display:grid;justify-items:center;gap:8px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.toast{background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:10px 15px;border-radius:14px;font-size:14px;max-width:340px;text-align:center;
  animation:tIn .3s ease both, tOut .45s ease forwards;animation-delay:0s, var(--hold,2.6s)}
.toast b{color:var(--gold)}
.toast.gold{border-color:rgba(243,196,91,.55);box-shadow:0 0 30px rgba(243,196,91,.2)}
.toast.gem{border-color:rgba(195,166,255,.55);box-shadow:0 0 30px rgba(195,166,255,.2)}
.toast.gem b,.toast b.g{color:var(--crystal-hi)}
@keyframes tIn{from{opacity:0;transform:translateY(-8px) scale(.97)}}
@keyframes tOut{to{opacity:0;transform:translateY(-6px)}}
.pop{position:fixed;z-index:7;pointer-events:none;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--gold);
  text-shadow:0 2px 10px rgba(0,0,0,.7);transform:translate(-50%,-50%);animation:pop .9s ease-out forwards;white-space:nowrap;font-variant-numeric:tabular-nums}
.pop.big{font-size:20px;color:var(--gold-hi)}
.pop.gem{font-size:17px;color:var(--crystal-hi)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-75%) scale(1.06)}100%{opacity:0;transform:translate(-50%,-200%) scale(1)}}
.veil{position:fixed;inset:0;z-index:30;background:rgba(6,7,18,.62);display:grid;grid-template-columns:minmax(0,1fr);place-items:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  padding-block:24px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));animation:tIn .3s ease}
.card{width:100%;max-width:420px;box-sizing:border-box;background:var(--panel-solid);border:1px solid var(--line);border-radius:22px;padding:22px 20px 20px;display:grid;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.card .eyebrow{font-family:var(--f-display);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.card h2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.card p{margin:0;line-height:1.55}
.card .meta{color:var(--muted);font-size:13px}
.card .eyebrow.gem{color:var(--crystal)}
.reward{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:15px;background:rgba(195,166,255,.08);border:1px solid rgba(195,166,255,.28)}
.reward .gem-big{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--crystal-hi);font-variant-numeric:tabular-nums;white-space:nowrap}
.reward .gem-big svg{width:28px;height:28px}
.reward > span:last-child{font-size:13.5px;line-height:1.4;min-width:0}
.reward small{color:var(--muted);font-size:12.5px}
.card .big-num{font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums}
.primary{height:52px;border-radius:15px;border:0;cursor:pointer;background:linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, var(--gold-deep));color:var(--gold-ink);font-family:var(--f-display);font-weight:700;font-size:15px}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%);z-index:6;pointer-events:none;width:min(340px, calc(100% - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 15px;font-size:14px;line-height:1.45;text-align:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:opacity .5s}
.hint b{color:var(--gold)}
.hint small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.nogl{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding-inline:24px;color:var(--muted)}
.veil.low{align-items:end;background:linear-gradient(180deg, rgba(6,7,18,0) 30%, rgba(6,7,18,.7) 100%);-webkit-backdrop-filter:none;backdrop-filter:none;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
@media (min-width:700px){ .coins{font-size:32px} .strata{max-width:560px} }
@media (prefers-reduced-motion: reduce){ .pill{animation:none} .sheet{transition:none} }
</style>
</head>
<body>
<!--BODY-->
<canvas id="stage" aria-label="Der Würfel. Tippen klopft Würfelchen ab, Ziehen dreht, zwei Finger zoomen."></canvas>

<header class="hud">
  <div class="hud-row">
    <div class="purse">
      <svg class="coin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l8.5 4.8v9.4L12 21.5l-8.5-4.8V7.3z" fill="var(--gold)"/><path d="M12 12l8.5-4.7v9.4L12 21.5z" fill="var(--gold-deep)"/><path d="M12 12L3.5 7.3 12 2.5l8.5 4.8z" fill="var(--gold-hi)"/></svg>
      <div class="purse-txt">
        <div class="coins" id="coins">0</div>
        <div class="rate" id="rate">Tippe auf den Würfel</div>
      </div>
    </div>
    <div class="tools">
      <button class="gem-btn" id="gemBtn" aria-label="Kristallschmiede öffnen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10l4 5-9 11L3 9z" fill="var(--crystal)"/><path d="M3 9h18l-9 11z" fill="var(--crystal-deep)"/><path d="M7 4h10l4 5H3z" fill="var(--crystal-hi)"/></svg><span id="gemCount">0</span><i class="dot" id="gemDot" hidden></i></button>
      <button class="icon-btn" id="menuBtn" aria-label="Logbuch öffnen"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg></button>
    </div>
  </div>
  <div class="strata">
    <div class="strata-top"><span><i class="swatch"></i><span id="layerName">Schicht 1 von 10</span></span><span id="layerStats">Härte 1</span></div>
    <div class="bar"><i id="layerBar"></i></div>
    <div class="strata-bot"><span id="leftCount">–</span><span id="cubePct">0 % freigelegt</span></div>
  </div>
</header>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="status"><span class="pill" id="frenzy" hidden>Goldrausch</span><div class="combo" id="combo" hidden></div></div>
<div class="hint" id="hint" hidden><b>Was ist im Würfel?</b> Tippe auf ihn und klopf ihn Würfelchen für Würfelchen ab.<small>Ziehen dreht · zwei Finger zoomen · Münzen gibst du in der Werkstatt aus</small></div>

<nav class="dock">
  <button class="icon-btn" id="soundBtn" aria-label="Ton ausschalten"></button>
  <button class="shop-btn" id="shopBtn">Werkstatt<i class="dot" id="shopDot" hidden></i></button>
  <button class="blast locked" id="blastBtn" aria-label="Sprengladung">
    <svg class="ring" viewBox="0 0 56 56" aria-hidden="true"><circle class="track" cx="28" cy="28" r="25"/><circle class="prog" id="blastRing" cx="28" cy="28" r="25" stroke-dasharray="157.08" stroke-dashoffset="157.08"/></svg>
    <span id="blastIco"></span>
  </button>
</nav>

<section class="sheet" id="shop" aria-label="Werkstatt">
  <div class="sheet-head">
    <h2>Werkstatt</h2>
    <div class="seg" role="group" aria-label="Kaufmenge">
      <button id="amt1" data-amt="1" class="on">×1</button><button id="amt10" data-amt="10">×10</button><button id="amtMax" data-amt="max">Max</button>
    </div>

/* =========================================================
   Formatierung
   ========================================================= */
const SUF = [[1e33,'Quint'],[1e30,'Qrd'],[1e27,'Quad'],[1e24,'Qua'],[1e21,'Trd'],[1e18,'Trio'],[1e15,'Brd'],[1e12,'Bio'],[1e9,'Mrd'],[1e6,'Mio'],[1e4,'Tsd']];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  const a = Math.abs(n);
  if (a >= 1e36) return n.toExponential(2).replace('.', ',').replace('e+', 'e');
  if (a < 10 && a % 1 > 0.05) return n.toLocaleString('de-DE', { maximumFractionDigits: 1 });
  for (const [v, s] of SUF) if (a >= v) {
    const d = v === 1e4 ? 1e3 : v, x = n / d;
    return x.toLocaleString('de-DE', { maximumFractionDigits: x < 10 ? 2 : x < 100 ? 1 : 0 }) + ' ' + s;
  }
  return Math.floor(n).toLocaleString('de-DE');
}
const fmtX = x => x.toLocaleString('de-DE', { maximumFractionDigits: x < 10 ? 2 : 1 });
const fmtCd = sec => { sec = Math.ceil(sec); const m = Math.floor(sec / 60), r = sec % 60; return m ? `${m}:${String(r).padStart(2, '0')} Min` : `${r} Sek`; };
function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (h > 0) return `${h} Std ${m} Min`;
  if (m > 0) return `${m} Min${s && m < 10 ? ` ${s} Sek` : ''}`;
  return `${s} Sek`;
}

/* =========================================================
   Würfelmodell: Voxel, Schichten, aktive Liste
   ========================================================= */
let N = 20, S = 10, N3 = 8000, HALF = 9.5;
let alive, hp, shellOf, posIn, act, actLen = 0, col, colored, shellTotal = 0, cubeRemoved = 0;
let finished = false, pendingDone = false, dirty = true, golden = -1, goldenLife = 0, goldenTimer = 40;
let highlightWarned = false;
let instA, instN, nCount = 0, aCount = 0;

const shellCount = s => { const a = N - 2*s, b = Math.max(0, a - 2); return a*a*a - b*b*b; };
const ix = i => i % N, jy = i => ((i / N) | 0) % N, kz = i => (i / (N*N)) | 0;

function themeOf(s) { return s === S - 1 ? CORE : THEMES[(s + G.c * 5) % THEMES.length]; }

function hash3(i, j, k) {
  let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(k, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1103515245); h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
function hsl(h, s, l) {
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)];
}
function paintVoxel(idx, th) {
  const i = ix(idx), j = jy(idx), k = kz(idx);
  const x = i - HALF, y = j - HALF, z = k - HALF;
  const ax = Math.abs(x), ay = Math.abs(y), az = Math.abs(z);
  let a, b;
  if (ax >= ay && ax >= az) { a = y; b = z; } else if (ay >= az) { a = x; b = z; } else { a = x; b = y; }
  const w = th.w || 2, r = hash3(i, j, k);
  let t = 0, c;
  switch (th.p) {
    case 'noise':   t = r < 0.14 ? 0.7 : 0; break;
    case 'diag':    t = Math.floor((a + b + 200) / w) & 1; break;
    case 'checker': t = (Math.floor((a + 200) / w) + Math.floor((b + 200) / w)) & 1; break;
    case 'stripes': t = Math.floor((y + 200) / w) & 1; break;
    case 'rings':   t = Math.floor(Math.max(Math.abs(a), Math.abs(b)) / w) & 1; break;
    case 'diamond': t = Math.floor((Math.abs(a) + Math.abs(b)) / w) & 1; break;
    case 'speck':   t = r < 0.13 ? 1 : 0; break;
    case 'blot':    t = (Math.sin(x*.62) + Math.sin(y*.57 + 1.7) + Math.sin(z*.66 + 3.1)) > 0.7 ? 1 : 0; break;
  }
  if (th.p === 'pearl') c = hsl((a*0.035 + b*0.027 + y*0.02 + r*0.06 + 1) % 1, 0.42, 0.80);
  else c = [th.a[0] + (th.b[0]-th.a[0])*t, th.a[1] + (th.b[1]-th.a[1])*t, th.a[2] + (th.b[2]-th.a[2])*t];
  const v = 0.95 + 0.10 * r;
  col[idx*3] = c[0]*v; col[idx*3+1] = c[1]*v; col[idx*3+2] = c[2]*v;
}
function ensureColors(s) {
  if (s < 0 || s >= S || colored[s]) return;
  const th = themeOf(s);
  for (let idx = 0; idx < N3; idx++) if (shellOf[idx] === s) paintVoxel(idx, th);
  colored[s] = 1;
}

function buildCube(c) {
  N = cubeN(c); S = N / 2; N3 = N*N*N; HALF = (N - 1) / 2;
  alive = new Uint8Array(N3).fill(1);
  hp = new Float32Array(N3);
  shellOf = new Uint8Array(N3);
  posIn = new Int32Array(N3).fill(-1);
  col = new Float32Array(N3 * 3);
  colored = new Uint8Array(S);
  for (let k = 0; k < N; k++) for (let j = 0; j < N; j++) for (let i = 0; i < N; i++)
    shellOf[i + N*(j + N*k)] = Math.min(i, j, k, N-1-i, N-1-j, N-1-k);
  const maxShell = shellCount(0);
  act = new Int32Array(maxShell);
  instA = new Float32Array(maxShell * 8);
  instN = new Float32Array(maxShell * 8);
  finished = false; golden = -1; cubeRemoved = 0;
}

// Schicht s aktivieren; restore = Map(idx -> hp) beim Laden
function activateShell(s, restore) {
  actLen = 0; posIn.fill(-1);
  const max = hpOf(s);
  for (let idx = 0; idx < N3; idx++) {
    const sh = shellOf[idx];
    if (sh < s) { alive[idx] = 0; continue; }
    if (sh !== s) continue;
    if (restore) {
      if (restore.has(idx)) { alive[idx] = 1; hp[idx] = Math.min(max, restore.get(idx)); }
      else { alive[idx] = 0; continue; }
    } else { alive[idx] = 1; hp[idx] = max; }
    posIn[idx] = actLen; act[actLen++] = idx;
  }
  shellTotal = shellCount(s);
  ensureColors(s); ensureColors(s + 1);
  buildNext(s + 1);
  highlightWarned = actLen <= highlightThreshold();
  dirty = true;
  setLayerAccent();
}
function buildNext(s) {
  nCount = 0;
  if (s >= S) { uploadNext(); return; }
  for (let idx = 0; idx < N3; idx++) {
    if (shellOf[idx] !== s) continue;
    const o = nCount++ * 8;
    instN[o] = ix(idx) - HALF; instN[o+1] = jy(idx) - HALF; instN[o+2] = kz(idx) - HALF; instN[o+3] = 1.0;
    instN[o+4] = col[idx*3]*0.93; instN[o+5] = col[idx*3+1]*0.93; instN[o+6] = col[idx*3+2]*0.93; instN[o+7] = 0;
  }

}

});

/* Ton */
function updSound() { $('soundBtn').innerHTML = svg(G.sound ? 'sndOn' : 'sndOff'); $('soundBtn').setAttribute('aria-label', G.sound ? 'Ton ausschalten' : 'Ton einschalten'); if (master) master.gain.value = G.sound ? 0.55 : 0; }
$('soundBtn').addEventListener('click', () => { unlockAudio(); G.sound = !G.sound; updSound(); save(); });

/* Logbuch */
let confirmReset = false;
function renderMenu() {
  const st = G.stats;
  $('menuBody').innerHTML = `
    <dl class="stats">
      <dt>Aktueller Würfel</dt><dd>Nr. ${G.c + 1} · ${N}×${N}×${N}</dd>
      <dt>Würfelchen abgetragen</dt><dd>${fmt(st.removed)}</dd>
      <dt>Tipps</dt><dd>${fmt(st.taps)}</dd>
      <dt>Beste Combo</dt><dd>${st.bestCombo}</dd>
      <dt>Münzen verdient</dt><dd>${fmt(G.total)}</dd>
      <dt>Spielzeit</dt><dd>${fmtTime(st.playSec)}</dd>
      <dt>Geöffnete Würfel</dt><dd>${G.c}</dd>
      <dt>Goldene Würfelchen</dt><dd>${fmt(st.golden || 0)}</dd>
      <dt>Kernkristalle verdient</dt><dd>${fmt(G.crTotal)}</dd>
      <dt>Münzen-Bonus</dt><dd>×${fmtX(permCoin())}</dd>
      <dt>Schaden-Bonus</dt><dd>×${fmtX(permDmg())}</dd>
    </dl>
    <div class="section-label">So läuft’s</div>
    <p class="muted-note">Jede Schicht muss ganz weg, bevor die nächste freiliegt. Tiefere Schichten sind härter und mehr wert. Goldene Würfelchen bringen Münzen oder einen Goldrausch. Drohnen arbeiten weiter, wenn du das Spiel schließt, so lange wie deine Nachtschicht reicht. Jeder geöffnete Würfel bringt Kernkristalle für die Kristallschmiede, dort schaltest du Dinge dauerhaft frei. Der Spielstand wird auf diesem Gerät gespeichert.</p>
    <div class="section-label">Spielstand</div>
    ${confirmReset
      ? `<div class="confirm-row"><button class="yes" id="resetYes">Ja, alles löschen</button><button class="no" id="resetNo">Abbrechen</button></div>`
      : `<button class="danger" id="resetBtn">Spielstand löschen</button>`}`;
  const rb = $('resetBtn'), ry = $('resetYes'), rn = $('resetNo');
  if (rb) rb.onclick = () => { confirmReset = true; renderMenu(); };
  if (rn) rn.onclick = () => { confirmReset = false; renderMenu(); };
  if (ry) ry.onclick = () => { confirmReset = false; hardReset(); closeSheets(); };
}
$('menuBtn').addEventListener('click', () => { if ($('menu').classList.contains('open')) closeSheets(); else { confirmReset = false; renderMenu(); openSheet('menu'); } });

/* Modals */
const modalQ = [];
function modal(html, btnText, onOk, low) {
  if (document.querySelector('.veil')) { modalQ.push([html, btnText, onOk, low]); return; }
  const v = document.createElement('div'); v.className = 'veil' + (low ? ' low' : '');
  v.innerHTML = `<div class="card" role="dialog" aria-modal="true">${html}<button class="primary" id="modalOk">${btnText}</button></div>`;
  document.body.appendChild(v);
  const ok = v.querySelector('#modalOk');
  ok.addEventListener('click', () => { unlockAudio(); v.remove(); onOk && onOk(); const nx = modalQ.shift(); if (nx) setTimeout(() => modal(...nx), 250); });
}
function hideHint() { const h = $('hint'); h.style.opacity = 0; setTimeout(() => { h.hidden = true; }, 500); }

/* Finale & neuer Würfel */
let finaleShown = false;
function reachFinale(quiet) {
  finished = true; actLen = 0; aCount = 0; nCount = 0; uploadNext(); dirty = true; golden = -1; blastArmed = false;
  fitTarget = 15;
  setLayerAccent(); save();
  if (!quiet) { sfx.finale(); vibrate(60); setTimeout(showFinale, 2400); }
}
function showFinale() {
  if (finaleShown) return; finaleShown = true;
  const secret = SECRETS[Math.min(G.c, SECRETS.length - 1)];
  const nc = G.c + 1, reward = crystalsFor(G.c);
  modal(`
    <div class="eyebrow">Würfel ${G.c + 1} · ${N}×${N}×${N} · ${fmt(N3)} Würfelchen</div>
    <h2>Im Würfel war …</h2>
    <p>${secret}</p>
    <div class="reward"><span class="gem-big">${svg('gemFill')}+${reward}</span><span>Kernkristalle für die Kristallschmiede${G.golden ? `<br><small>dazu ${G.golden} aus goldenen Würfelchen unterwegs</small>` : ''}</span></div>
    <p class="meta">Gebraucht: ${fmtTime(G.stats.cubeSec)}. Der nächste Würfel ist größer und härter. Deine Neugier bleibt: Münzen ×${fmtX(neuCoin(nc))} und Schaden ×${fmtX(neuDmg(nc))}. Münzen und Werkstatt starten neu, Kristalle und alles aus der Kristallschmiede bleiben.</p>`,
    'Kristalle nehmen, weiter', () => { finaleShown = false; prestige(reward); }, true);
}
function prestige(reward) {
  G.cr += reward; G.crTotal += reward;
  G.c++; G.coins = capitalAt(G.P.capital); G.layer = 0; G.frenzy = 0; G.stats.cubeSec = 0; G.golden = 0;
  for (const k in G.L) G.L[k] = 0;
  G.L.drone = 3 * G.P.swarm;
  blastLeft = 0; blastArmed = false; combo = 0; pN = 0; laserCd = 3; bomberCd = 10; goldenTimer = 40; resetSpecials();
  buildCube(G.c); activateShell(0);
  fitTarget = fitFor(N); cam.fit = fitTarget * 1.6;
  renderShop(); updBlast(); updHUD(); save();
  toast(`Würfel ${G.c + 1}: <b>${N}×${N}×${N}</b>. Viel Neugier!`, null, 3.2);
  sfx.chime();
  setTimeout(openForge, 900);
}
function newGame() {
  G.c = 0; G.layer = 0; G.coins = 0; G.total = 0; G.frenzy = 0;
  for (const k in G.L) G.L[k] = 0;
  G.stats = { taps: 0, removed: 0, playSec: 0, cubeSec: 0, bestCombo: 0, golden: 0 };
  G.cr = 0; G.crTotal = 0; G.P = defaultP(); G.skins = ['ice']; G.skin = 'ice'; G.robotOn = true; G.golden = 0;
  buildCube(0); activateShell(0);
  fitTarget = fitFor(N); cam.fit = fitTarget * 1.5;
}
function hardReset() {
  store.del(); const keepSound = G.sound;
  newGame(); G.sound = keepSound; G.intro = false; blastLeft = 0; blastArmed = false; pN = 0;
  $('hint').hidden = false; $('hint').style.opacity = 1;
  renderShop(); updBlast(); updHUD(); save();
  toast('Neuer Würfel. Alles auf Anfang.');
}

/* =========================================================
   Offline-Fortschritt
   ========================================================= */
function catchUp(sec, announce) {
  if (finished || G.L.drone === 0 || sec < 1) return;
  const capSec = nightAt(G.L.night) * 3600, eff = Math.min(sec, capSec);
  let hits = G.L.drone * droneRate() * eff, d = droneDmg();
  let n = Math.floor(hits); if (n < 1) return;
  if (n > 150000) { d *= n / 150000; n = 150000; }
  const c0 = G.coins, r0 = G.stats.removed, l0 = G.layer;
  golden = -1;
  for (let h = 0; h < n && !finished; h++) {
    if (actLen === 0) { layerComplete(true); continue; }
    hitVoxel(act[(Math.random() * actLen) | 0], d, 1, 0);
    if (pendingDone) layerComplete(true);
  }
  fitTarget = finished ? 15 : fitFor(N - 2 * G.layer); cam.fit = fitTarget;
  dirty = true; save();
  const gained = G.coins - c0, removed = G.stats.removed - r0, layers = G.layer - l0;
  if (announce && (removed > 0 || gained > 0)) {
    modal(`
      <div class="eyebrow">Willkommen zurück</div>
      <h2>Deine Drohnen haben ${fmtTime(eff)} gearbeitet</h2>
      <div class="big-num">+${fmt(gained)} Münzen</div>
      <p class="meta">${fmt(removed)} Würfelchen abgetragen${layers > 0 ? `, ${layers} ${layers === 1 ? 'neue Schicht' : 'neue Schichten'} freigelegt` : ''}.${sec > capSec ? ` Du warst ${fmtTime(sec)} weg, die Nachtschicht reicht ${nightAt(G.L.night)} Std. In der Werkstatt kannst du sie verlängern.` : ''}</p>`,
      'Weiter klopfen', () => { if (finished) showFinale(); });
  } else if (removed > 0) {
    toast(`Drohnen: ${fmt(removed)} Würfelchen, <b>+${fmt(gained)}</b>`);
    if (finished) setTimeout(showFinale, 600);
  }
  updHUD(); updShop();
}

/* =========================================================
   Speichern (IndexedDB, localStorage als Rückfall)
   ========================================================= */
const store = {
  db: null,
  open() {
    return new Promise(res => {
      const to = setTimeout(res, 1500);
      try {
        const r = indexedDB.open('neugierwuerfel', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { store.db = r.result; clearTimeout(to); res(); };
        r.onerror = r.onblocked = () => { clearTimeout(to); res(); };
      } catch (e) { clearTimeout(to); res(); }
    });
  },
  getIDB() {
    return new Promise(res => {
      if (!store.db) return res(null);
      try { const q = store.db.transaction('kv').objectStore('kv').get('save'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); }
    });
  },
  getLS() { try { return JSON.parse(localStorage.getItem('neugierwuerfel_save') || 'null'); } catch (e) { return null; } },
  set(v) {
    try { if (store.db) store.db.transaction('kv', 'readwrite').objectStore('kv').put(v, 'save'); } catch (e) {}
    try { localStorage.setItem('neugierwuerfel_save', JSON.stringify(v)); } catch (e) {}
  },
  del() {
    try { if (store.db) store.db.transaction('kv', 'readwrite').objectStore('kv').delete('save'); } catch (e) {}
    try { localStorage.removeItem('neugierwuerfel_save'); } catch (e) {}
  }
};
function snapshot() {
  const ids = Array.from(act.subarray(0, actLen));
  return { v: 1, c: G.c, layer: G.layer, coins: G.coins, total: G.total, L: { ...G.L }, stats: { ...G.stats }, sound: G.sound, intro: G.intro,
    cr: G.cr, crTotal: G.crTotal, P: { ...G.P }, skins: G.skins.slice(), skin: G.skin, robotOn: G.robotOn, golden: G.golden,
    blastLeft, bomberCd, fin: finished, act: ids, hp: ids.map(i => +hp[i].toPrecision(6)), last: Date.now() };
}
let booted = false, retroGrant = 0;
function save() { if (booted) store.set(snapshot()); }
function restore(s) {
  G.c = s.c | 0; G.layer = s.layer | 0; G.coins = +s.coins || 0; G.total = +s.total || 0;
  for (const k in G.L) G.L[k] = (s.L && s.L[k]) | 0;
  G.stats = Object.assign({ taps: 0, removed: 0, playSec: 0, cubeSec: 0, bestCombo: 0, golden: 0 }, s.stats || {});
  G.sound = s.sound !== false; G.intro = !!s.intro; blastLeft = +s.blastLeft || 0; if (+s.bomberCd > 0) bomberCd = +s.bomberCd;
  G.P = defaultP(); if (s.P) for (const k in G.P) G.P[k] = Math.min(PERKS.find(p => p.id === k).max, s.P[k] | 0);
  G.cr = +s.cr || 0; G.crTotal = +s.crTotal || 0; G.golden = s.golden | 0; G.robotOn = s.robotOn !== false;
  G.skins = ['ice'].concat((Array.isArray(s.skins) ? s.skins : []).filter(id => id !== 'ice' && SKINS.some(k => k.id === id)));
  G.skin = G.skins.includes(s.skin) ? s.skin : 'ice';
  if (!s.P && G.c > 0) { let r = 0; for (let i = 0; i < G.c; i++) r += crystalsFor(i); G.cr += r; G.crTotal += r; retroGrant = r; }
  buildCube(G.c);
  if (s.fin || G.layer >= S) {
    G.layer = S; alive.fill(0); actLen = 0; cubeRemoved = N3; finished = true; fitTarget = 15; setLayerAccent();
  } else {
    const m = new Map(); (s.act || []).forEach((idx, i) => m.set(idx, s.hp[i]));
    activateShell(G.layer, m.size ? m : null);
    let rem = 0; for (let idx = 0; idx < N3; idx++) if (!alive[idx]) rem++; cubeRemoved = rem;
    if (actLen === 0) pendingDone = true;
    fitTarget = fitFor(N - 2 * G.layer);
  }
  cam.fit = fitTarget;
}

/* =========================================================
   Hauptschleife
   ========================================================= */
let T = 0, lastTs = 0, hudT = 0, shopT = 0, saveT = 0;
function update(dt) {
  T += dt; G.stats.playSec += dt; if (!finished) G.stats.cubeSec += dt;
  if (G.frenzy > 0) G.frenzy = Math.max(0, G.frenzy - dt);
  if (blastLeft > 0) { blastLeft = Math.max(0, blastLeft - dt); if (blastLeft === 0) { updBlast(); if (G.L.blast) toast('Sprengladung wieder bereit.'); } }
  if (cam.shake > 0) cam.shake = Math.max(0, cam.shake - dt);
  if (pendingDone && !finished) layerComplete(false);
  // Drohnen
  if (!finished && G.L.drone > 0 && actLen > 0) {
    droneAcc += G.L.drone * droneRate() * dt;
    let n = Math.floor(droneAcc); droneAcc -= n;
    if (n > 0) {
      let d = droneDmg() * frenzyMul(); if (n > 300) { d *= n / 300; n = 300; }
      let beams = 0;
      for (let h = 0; h < n && actLen > 0 && !finished; h++) {
        let idx = act[(Math.random() * actLen) | 0];
        if (idx === golden) { if (actLen < 2) continue; idx = act[(Math.random() * actLen) | 0]; if (idx === golden) continue; }
        const g = hitVoxel(idx, d, 1, 1);
        if (beams < 2) { beam(idx); beams++; }
        if (g) sfx.plink();
        if (pendingDone) layerComplete(false);
      }
    }
  }
  // Goldene Würfelchen
  if (!finished) {
    if (golden >= 0) {
      goldenLife -= dt;
      if (goldenLife <= 0 || !alive[golden]) { golden = -1; dirty = true; }
      else if (Math.random() < dt * 10) { const p = worldOf(golden), n = normalOf(golden); addP(p[0] + n[0]*.6 + rnd(-.45,.45), p[1] + n[1]*.6 + rnd(-.45,.45), p[2] + n[2]*.6 + rnd(-.45,.45), n[0]*1.6, n[1]*1.6 + 1, n[2]*1.6, .55, .12, 1, .86, .4, 3.2, 0); }
    }
    else { goldenTimer -= dt; if (goldenTimer <= 0) { goldenTimer = rnd(45, 90) * (1 - 0.1 * G.P.seeker); spawnGolden(); } }
    updSpecials(dt);
    if (golden >= 0 && G.P.seeker > 0 && goldenLife < 8 && (SD.seeker.here || goldenLife < 1.5)) seekGolden();
    if (actLen > 0 && G.P.laser > 0) { laserCd -= dt; if (laserCd <= 0 && !SD.laser.job && fireLaser()) laserCd = laserInt(); }
    if (actLen > 0 && G.P.bomber > 0) { bomberCd -= dt; if (bomberCd <= 0 && !SD.bomber.job && !SD.bomber.bomb && dropBomb()) bomberCd = bomberInt(); }
    if (G.P.robot && G.robotOn) { robotT -= dt; if (robotT <= 0) { robotT = 0.5; robotTick(); } }
    if (!highlightWarned && actLen > 0 && actLen <= highlightThreshold()) {
      highlightWarned = true; dirty = true;
      toast(`Nur noch <b>${actLen}</b> Würfelchen in dieser Schicht. Sie leuchten jetzt.`);
    }
  }
  droneTrails(dt);
  updP(dt);
  // Kamera
  cam.fit += (fitTarget - cam.fit) * (1 - Math.exp(-dt * 2.2));
  if (ptrs.size === 0) { cam.yaw += cam.yv * dt; cam.pitch = clamp(cam.pitch + cam.pv * dt, -1.4, 1.4); cam.yv *= Math.exp(-dt * 3.5); cam.pv *= Math.exp(-dt * 3.5); }
  cam.idle += dt;
  if (!reduceMotion && cam.idle > 7 && ptrs.size === 0) cam.yaw += dt * 0.07 * Math.min(1, (cam.idle - 7) / 3);
  if (finished && !reduceMotion) cam.yaw += dt * 0.15;
}
let droneAcc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  let dtr = (ts - lastTs) / 1000; lastTs = ts;
  if (!(dtr >= 0)) dtr = 0;
  if (dtr > 3) { catchUp(dtr, dtr >= 60); dtr = 0; }
  const dt = Math.min(dtr, 0.1);
  frameGain = 0;
  update(dt);
  render();
  hudT += dt; shopT += dt; saveT += dt;
  if (hudT > 0.1) { hudT = 0; updHUD(); if (blastLeft > 0) updBlast(); }
  if (shopT > 0.25) { shopT = 0; if ($('shop').classList.contains('open')) updShop(); if ($('forge').classList.contains('open')) updForge(); }
  if (saveT > 15) { saveT = 0; save(); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);
cv.addEventListener('webglcontextlost', e => { e.preventDefault(); save(); });
cv.addEventListener('webglcontextrestored', () => location.reload());

/* =========================================================
   Start
   ========================================================= */
async function start(hot) {
  resize();
  await store.open();
  let s = hot && hot.save;
  if (!s) { const a = await store.getIDB(), b = store.getLS(); s = a && b ? (a.last >= b.last ? a : b) : (a || b); }
  if (s && s.v === 1) { try { restore(s); } catch (e) { console.warn('Spielstand defekt, neues Spiel', e); newGame(); s = null; } }
  else { newGame(); s = null; }
  booted = true;
  renderShop(); updBlast(); updSound(); updHUD();
  if (!G.intro) $('hint').hidden = false;
  if (s && s.last) {
    const away = (Date.now() - s.last) / 1000;
    if (blastLeft > 0) { blastLeft = Math.max(0, blastLeft - Math.max(0, away)); updBlast(); }
    if (away > 0) bomberCd = Math.max(3, bomberCd - away);
    if (away > 5) catchUp(away, away >= 60);
  }
  if (retroGrant > 0) {
    modal(`
      <div class="eyebrow gem">Neu</div>
      <h2>Die Kristallschmiede</h2>
      <p>Jeder geöffnete Würfel bringt jetzt Kernkristalle, jedes goldene Würfelchen, das du selbst antippst, einen weiteren. Damit schaltest du dauerhaft Spezialdrohnen, Boni und Drohnenfarben frei.</p>
      <div class="reward"><span class="gem-big">${svg('gemFill')}+${retroGrant}</span><span>nachträglich für ${G.c === 1 ? 'deinen ersten Würfel' : `deine ${G.c} geöffneten Würfel`}</span></div>`,
      'Kristallschmiede öffnen', openForge);
  }
  if (finished) setTimeout(showFinale, 800);
  save();
  requestAnimationFrame(frame);
  if (location.hash === '#test') window.__nw = { G, doTap, spawnGolden, renderMenu, openSheet, openForge, fireLaser, dropBomb, prestige, showFinale, catchUp, get N() { return N; }, get actLen() { return actLen; }, get finished() { return finished; }, layerComplete, updShop, updHUD, cam, rawPick: pick, get sd() { return SD; }, get golden() { return golden; }, get goldenLife() { return goldenLife; } };
}
try { window.claude?.hot?.snapshot?.(() => ({ save: snapshot() })); } catch (e) {}
const hotApi = window.claude?.hot;
if (hotApi && hotApi.ready) hotApi.ready(d => start(d || {})); else start((hotApi && hotApi.data) || {});
})();
</script>
